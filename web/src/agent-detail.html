<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - agent</title>
        <meta name="description" content="Scufris - a single agent." />
    </head>
    <body>
        <div id="app">
            <div id="header"></div>
            <!-- The chat-first detail (/agents/<id>); hidden on the settings sub-page. -->
            <main class="agent-shell agent-detail-page" id="agent-detail-main">
                <aside id="agent-sidebar" class="sidebar">
                    <span class="settings__loading">loading...</span>
                </aside>
                <section
                    id="agent-chat"
                    class="agent-chat chat--page"
                ></section>
            </main>
            <!-- The per-agent settings page (/agents/<id>/settings). -->
            <main class="settings" id="agent-settings" hidden></main>
            <div id="footer"></div>
        </div>
    </body>
</html>
