<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - stats</title>
        <meta
            name="description"
            content="Scufris - live host stats dashboard."
        />
    </head>
    <body>
        <div id="app">
            <div id="header"></div>
            <div id="host-summary" class="host-summary">
                <span class="host-summary__loading">connecting...</span>
            </div>
            <main id="cards" class="cards"></main>
            <!-- Host inspection, polled on its own slower clock (the endpoint
                 shells out server-side). See renderHostCards in stats-view.ts. -->
            <section id="host-cards" class="cards"></section>
            <section id="processes" class="processes"></section>
            <div id="footer"></div>
        </div>
    </body>
</html>
