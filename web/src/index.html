<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - agent</title>
        <meta
            name="description"
            content="Scufris - chat with your scuffed Jarvis."
        />
    </head>
    <body>
        <div id="app">
            <div id="header"></div>
            <div class="agent-shell">
                <aside class="sidebar" id="sidebar">
                    <button id="chat-reset" class="sidebar__new" type="button">
                        + New chat
                    </button>
                    <div class="chat__head">
                        <span id="agent-model" class="agent-meta"></span>
                        <a
                            id="agent-tools-link"
                            class="agent-tools-link"
                            href="/settings/"
                            hidden
                            >tools</a
                        >
                    </div>
                    <section
                        class="sidebar__section sidebar__section--sessions"
                        aria-label="sessions"
                    >
                        <div class="sidebar__label">Sessions</div>
                        <div id="session-list" class="sidebar__list"></div>
                    </section>
                    <div class="sidebar__foot">
                        <div
                            id="context-panel"
                            class="usage-block"
                            aria-label="this session"
                        ></div>
                        <div
                            id="usage-meter"
                            class="usage-block"
                            aria-label="account"
                        ></div>
                    </div>
                </aside>
                <section id="agent-chat" class="chat chat--page"></section>
            </div>
            <div id="footer"></div>
        </div>
    </body>
</html>
