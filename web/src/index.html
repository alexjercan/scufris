<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - agent</title>
        <meta
            name="description"
            content="Scufris - chat with your scuffed Jarvis."
        />
    </head>
    <body>
        <div id="app">
            <div id="header"></div>
            <div class="agent-shell">
                <aside class="sidebar" id="sidebar">
                    <button id="chat-reset" class="sidebar__new" type="button">
                        + New chat
                    </button>
                    <div
                        id="session-list"
                        class="sidebar__list"
                        aria-label="sessions"
                    ></div>
                    <div class="sidebar__foot">
                        <div id="context-panel" class="usage-block"></div>
                        <div id="usage-meter" class="usage-block"></div>
                    </div>
                </aside>
                <main class="chat chat--page" id="chat">
                    <div class="chat__head">
                        <h2 class="card__title"><span>Agent</span></h2>
                        <div class="agent-bar">
                            <span id="agent-model" class="agent-meta"></span>
                            <span id="agent-usage" class="agent-meta"></span>
                            <button
                                id="agent-tools-toggle"
                                class="chat__reset"
                                type="button"
                                hidden
                            >
                                tools
                            </button>
                        </div>
                    </div>
                    <div id="agent-tools" class="agent-tools" hidden></div>
                    <div id="chat-log" class="chat__log"></div>
                    <form id="chat-form" class="chat__form">
                        <input
                            id="chat-input"
                            class="chat__input"
                            type="text"
                            autocomplete="off"
                            placeholder="ask the agent about this host..."
                        />
                        <button id="chat-send" class="chat__send" type="submit">
                            send
                        </button>
                    </form>
                </main>
            </div>
            <div id="footer"></div>
        </div>
    </body>
</html>
