<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - host dashboard</title>
        <meta
            name="description"
            content="Scufris - a read-only dashboard for host stats."
        />
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <div class="brand">
                    <span class="brand__mark">SCUFRIS</span>
                    <span class="brand__sub">scuffed jarvis</span>
                </div>
                <div id="host-summary" class="host-summary">
                    <span class="host-summary__loading">connecting...</span>
                </div>
            </header>
            <main id="cards" class="cards"></main>
            <section class="chat" id="chat">
                <div class="chat__head">
                    <h2 class="card__title"><span>Agent</span></h2>
                    <button id="chat-reset" class="chat__reset" type="button">
                        new chat
                    </button>
                </div>
                <div id="chat-log" class="chat__log"></div>
                <form id="chat-form" class="chat__form">
                    <input
                        id="chat-input"
                        class="chat__input"
                        type="text"
                        autocomplete="off"
                        placeholder="ask the agent about this host..."
                    />
                    <button id="chat-send" class="chat__send" type="submit">
                        send
                    </button>
                </form>
            </section>
            <footer class="statusbar">
                <span id="status" class="statusbar__text">starting up</span>
            </footer>
        </div>
    </body>
</html>
