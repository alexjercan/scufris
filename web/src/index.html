<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - agent</title>
        <meta
            name="description"
            content="Scufris - chat with your scuffed Jarvis."
        />
    </head>
    <body>
        <div id="app">
            <div id="header"></div>
            <div class="agent-shell">
                <aside class="sidebar" id="sidebar">
                    <button id="chat-reset" class="sidebar__new" type="button">
                        + New chat
                    </button>
                    <section
                        class="sidebar__section sidebar__section--sessions"
                        aria-label="sessions"
                    >
                        <div class="sidebar__label">Sessions</div>
                        <div id="session-list" class="sidebar__list"></div>
                    </section>
                    <div class="sidebar__foot">
                        <div
                            id="context-panel"
                            class="usage-block"
                            aria-label="this session"
                        ></div>
                        <div
                            id="usage-meter"
                            class="usage-block"
                            aria-label="account"
                        ></div>
                    </div>
                </aside>
                <main class="chat chat--page" id="chat">
                    <div class="chat__head">
                        <span id="agent-model" class="agent-meta"></span>
                        <a
                            id="agent-tools-link"
                            class="agent-tools-link"
                            href="/settings/"
                            hidden
                            >tools</a
                        >
                    </div>
                    <div class="chat__log-wrap">
                        <div
                            id="chat-log"
                            class="chat__log"
                            role="log"
                            aria-live="polite"
                            aria-relevant="additions"
                            aria-label="conversation"
                        ></div>
                        <button
                            id="chat-jump"
                            class="chat__jump"
                            type="button"
                            hidden
                        >
                            new messages
                        </button>
                    </div>
                    <form id="chat-form" class="chat__form">
                        <textarea
                            id="chat-input"
                            class="chat__input"
                            rows="1"
                            autocomplete="off"
                            placeholder="ask the agent about this host... (Enter to send, Shift+Enter for newline)"
                        ></textarea>
                        <button id="chat-send" class="chat__send" type="submit">
                            send
                        </button>
                    </form>
                </main>
            </div>
            <div id="footer"></div>
        </div>
    </body>
</html>
