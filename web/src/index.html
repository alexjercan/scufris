<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scufris - agent</title>
        <meta
            name="description"
            content="Scufris - chat with your scuffed Jarvis."
        />
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <div class="brand">
                    <span class="brand__mark">SCUFRIS</span>
                    <span class="brand__sub">scuffed jarvis</span>
                </div>
                <nav class="nav">
                    <a class="nav__link" href="/">Agent</a>
                    <a class="nav__link" href="/stats/">Stats</a>
                </nav>
            </header>
            <main class="chat chat--page" id="chat">
                <div class="chat__head">
                    <h2 class="card__title"><span>Agent</span></h2>
                    <button id="chat-reset" class="chat__reset" type="button">
                        new chat
                    </button>
                </div>
                <div id="chat-log" class="chat__log"></div>
                <form id="chat-form" class="chat__form">
                    <input
                        id="chat-input"
                        class="chat__input"
                        type="text"
                        autocomplete="off"
                        placeholder="ask the agent about this host..."
                    />
                    <button id="chat-send" class="chat__send" type="submit">
                        send
                    </button>
                </form>
            </main>
            <footer class="statusbar">
                <span id="status" class="statusbar__text"></span>
            </footer>
        </div>
    </body>
</html>
