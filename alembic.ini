# A MAINTAINER's tool, not the runtime path.
#
# This file exists so `alembic revision --autogenerate` can be run from the repo
# root while writing a revision. The app never reads it: at startup
# `scufris.db.migrate` builds an `alembic.config.Config` in code, points
# `script_location` at the environment INSIDE the installed package, and hands
# Alembic an already-open connection from the app's own engine. See
# `scufris/README.md` section 9 for the revision workflow.
#
# `sqlalchemy.url` below is a scratch database for autogenerate to compare
# against, deliberately NOT the operator default `~/.local/state/scufris`:
# writing a revision must never touch real state. Migrate the scratch file to
# head first, then autogenerate against it.

[alembic]
# The shipped environment. A root `alembic/` would not reach an operator: the
# wheel is built with `only-include = ["scufris"]`.
script_location = scufris/db/migrations

prepend_sys_path = .

sqlalchemy.url = sqlite:///./.alembic-scratch.db

# No [loggers]/[handlers]/[formatters] sections: `env.py` deliberately never
# calls `logging.config.fileConfig`, because the runtime path runs inside a
# process that has already configured its own logging (`scufris.logsetup`) and
# must not have it replaced. Nothing would read them.
